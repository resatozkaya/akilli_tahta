name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Kodu cek
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
          cache: true

      - name: Flutter projesi olustur
        run: flutter create --org com.example --project-name akilli_tahta /tmp/fresh

      - name: Lib ve pubspec kopyala
        run: |
          rm -rf /tmp/fresh/lib
          cp -r akilli_tahta_app/lib /tmp/fresh/lib
          cp akilli_tahta_app/pubspec.yaml /tmp/fresh/pubspec.yaml

      - name: AndroidManifest - cleartext izni ekle
        run: |
          cat > /tmp/fresh/android/app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN"
                  android:usesPermissionFlags="neverForLocation"/>
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>
              <uses-permission android:name="android.permission.BLUETOOTH"
                  android:maxSdkVersion="30"/>
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN"
                  android:maxSdkVersion="30"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"
                  android:maxSdkVersion="30"/>
              <uses-feature android:name="android.hardware.bluetooth_le" android:required="false"/>
              <application
                  android:label="Akilli Tahta"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:taskAffinity=""
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme"/>
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data android:name="flutterEmbedding" android:value="2"/>
              </application>
          </manifest>
          EOF

      - name: app/build.gradle guncelle
        run: |
          cat > /tmp/fresh/android/app/build.gradle << 'GRADLE'
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }
          android {
              namespace "com.example.akilli_tahta"
              compileSdk 34
              ndkVersion flutter.ndkVersion
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              kotlinOptions { jvmTarget = "1.8" }
              defaultConfig {
                  applicationId "com.example.akilli_tahta"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release { signingConfig signingConfigs.debug }
              }
          }
          flutter { source "../.." }
          GRADLE

      - name: Bagimlilik yukle
        working-directory: /tmp/fresh
        run: flutter pub get

      - name: APK derle
        working-directory: /tmp/fresh
        run: flutter build apk --release --split-per-abi

      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: akilli-tahta-apk
          path: |
            /tmp/fresh/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            /tmp/fresh/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          retention-days: 30
