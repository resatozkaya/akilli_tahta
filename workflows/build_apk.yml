name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
          cache: true

      - name: Proje hazirla
        run: |
          flutter create --org com.example --project-name akilli_tahta /tmp/fresh
          cp akilli_tahta_app/pubspec.yaml /tmp/fresh/pubspec.yaml
          rm -rf /tmp/fresh/lib
          cp -r akilli_tahta_app/lib /tmp/fresh/lib
          echo "=== pubspec kontrol ==="
          grep "http:" /tmp/fresh/pubspec.yaml || echo "HTTP YOK!"
          grep "flutter_blue" /tmp/fresh/pubspec.yaml || echo "BLE YOK - DOGRU"

      - name: Pub get
        working-directory: /tmp/fresh
        run: flutter pub get

      - name: Pub kontrolu
        working-directory: /tmp/fresh
        run: |
          echo "=== Yuklenen paketler ==="
          flutter pub deps | grep -E "http|flutter_blue" || echo "Paket listesi bos"

      - name: AndroidManifest
        run: |
          cat > /tmp/fresh/android/app/src/main/AndroidManifest.xml << 'MANIFEST'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>
              <uses-permission android:name="android.permission.CHANGE_WIFI_STATE"/>
              <application
                  android:label="Akilli Tabela"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:launchMode="singleTop" android:taskAffinity=""
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true" android:windowSoftInputMode="adjustResize">
                      <meta-data android:name="io.flutter.embedding.android.NormalTheme" android:resource="@style/NormalTheme"/>
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data android:name="flutterEmbedding" android:value="2"/>
              </application>
          </manifest>
          MANIFEST

      - name: build.gradle
        run: |
          cat > /tmp/fresh/android/app/build.gradle << 'GRADLE'
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }
          android {
              namespace "com.example.akilli_tahta"
              compileSdk 34
              ndkVersion flutter.ndkVersion
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              kotlinOptions { jvmTarget = "1.8" }
              defaultConfig {
                  applicationId "com.example.akilli_tahta"
                  minSdk 21
                  targetSdk 34
                  versionCode 2
                  versionName "2.0"
              }
              buildTypes { release { signingConfig signingConfigs.debug } }
          }
          flutter { source "../.." }
          GRADLE

      - name: APK derle
        working-directory: /tmp/fresh
        run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: akilli-tabela-apk
          path: |
            /tmp/fresh/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            /tmp/fresh/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          retention-days: 30
