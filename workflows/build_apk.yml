name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
          cache: true

      - name: Proje hazirla
        run: |
          flutter create --org com.example --project-name akilli_tahta /tmp/fresh
          cp akilli_tahta_app/pubspec.yaml /tmp/fresh/pubspec.yaml
          rm -rf /tmp/fresh/lib
          cp -r akilli_tahta_app/lib /tmp/fresh/lib

      - name: Pub get
        working-directory: /tmp/fresh
        run: flutter pub get

      - name: Manifest ve network config kopyala
        run: |
          cp akilli_tahta_app/android/app/src/main/AndroidManifest.xml \
             /tmp/fresh/android/app/src/main/AndroidManifest.xml
          mkdir -p /tmp/fresh/android/app/src/main/res/xml
          cp akilli_tahta_app/android/app/src/main/res/xml/network_security_config.xml \
             /tmp/fresh/android/app/src/main/res/xml/network_security_config.xml
          echo "=== Manifest ==="
          grep "INTERNET\|cleartext\|networkSecurity" /tmp/fresh/android/app/src/main/AndroidManifest.xml

      - name: build.gradle
        run: |
          cat > /tmp/fresh/android/app/build.gradle << 'GRADLE'
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }
          android {
              namespace "com.example.akilli_tahta"
              compileSdk 34
              ndkVersion flutter.ndkVersion
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              kotlinOptions { jvmTarget = "1.8" }
              defaultConfig {
                  applicationId "com.example.akilli_tahta"
                  minSdk 21
                  targetSdk 34
                  versionCode 4
                  versionName "4.0"
              }
              buildTypes { release { signingConfig signingConfigs.debug } }
          }
          flutter { source "../.." }
          GRADLE

      - name: APK derle
        working-directory: /tmp/fresh
        run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: akilli-tabela-apk
          path: |
            /tmp/fresh/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            /tmp/fresh/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          retention-days: 30
